services:
  # ─────────────────────────────────────────────
  # Laravel App (FrankenPHP — servește HTTP)
  # ─────────────────────────────────────────────
  laravel_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventix_app
    restart: unless-stopped
    command: frankenphp run --config /var/www/html/Caddyfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_NAME=Laravel
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=eventix
      - DB_USERNAME=eventix
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=1
      - DB_MONGO_HOST=mongodb
      - DB_MONGO_PORT=27017
      - DB_MONGO_DATABASE=eventix
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - BROADCAST_CONNECTION=pusher
      - PUSHER_APP_ID=eventix
      - PUSHER_APP_KEY=eventix_key
      - PUSHER_APP_SECRET=eventix_secret
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
      - VITE_PUSHER_HOST=localhost
      - VITE_PUSHER_PORT=6001
      - VITE_PUSHER_SCHEME=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Horizon Worker (procesare cozi)
  # ─────────────────────────────────────────────
  laravel_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventix_worker
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - QUEUE_CONNECTION=redis
      - APP_ENV=local
      - APP_NAME=Laravel
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=eventix
      - DB_USERNAME=eventix
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_QUEUE=default
      - REDIS_CACHE_DB=1
      - DB_MONGO_HOST=mongodb
      - DB_MONGO_PORT=27017
      - DB_MONGO_DATABASE=eventix
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200

  # ─────────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventix_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PUSHER_HOST=localhost
      - VITE_PUSHER_PORT=6001
      - VITE_PUSHER_SCHEME=http
    depends_on:
      - laravel_app

  # ─────────────────────────────────────────────
  # postgres
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: eventix_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=eventix
      - POSTGRES_USER=eventix
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventix -d eventix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: eventix_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: eventix_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ─────────────────────────────────────────────
  # Elasticsearch
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.10
    container_name: eventix_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ─────────────────────────────────────────────
  # Soketi (server WebSocket, compatibil Pusher)
  # ─────────────────────────────────────────────
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: eventix_soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=eventix
      - SOKETI_DEFAULT_APP_KEY=eventix_key
      - SOKETI_DEFAULT_APP_SECRET=eventix_secret

  # ─────────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: eventix_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - laravel_app

  # ─────────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: eventix_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # phpMyAdmin
  # ─────────────────────────────────────────────
  adminer:            # replaces phpMyAdmin
    image: adminer
    container_name: eventix_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  es_data:
  grafana_data:
  backend_vendor:
  frontend_node_modules: